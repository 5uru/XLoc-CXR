[project]
name = "xloc-cxr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax[rocm]>=0.4.30",
    "flax>=0.10.0",
    "optax>=0.2.0",
    "tensorflow>=2.18.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.67.0",
    "kaggle>=1.7.0",
    "pandas>=2.2.0",
    "pydicom>=2.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
